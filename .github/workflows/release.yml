name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          archive="g9router-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w" -o "dist/g9router${suffix}" ./cmd/g9router
          tar -C dist -czf "dist/${archive}.tar.gz" "g9router${suffix}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/g9router-*.tar.gz
